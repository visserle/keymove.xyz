<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 -705 410 830" role="img" aria-label="keymove">
  <title>keymove</title>
  <!-- U+26B7 CHIRON, the key whose bit is a K — the mark without its tile, for
       Safari's `rel="mask-icon"`, which masks the artwork and tints it with the
       link's `color`. Single ink, exactly like lila's `lichess.svg`. The outline
       is the STIX Two Math glyph, mirrored about its centre so the bow (ring)
       sits at the top and the K's two arms form the bit at the bottom, the way a
       key is normally drawn. -->
